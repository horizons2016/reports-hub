name: نشر الموقع (deploy)

on:
  push:
    branches: [main]
    paths: ["site/**", "config/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build site
        run: |
          mkdir -p _site/data
          cp -r site/* _site/
          cp data/*.json data/feed.xml _site/data/ 2>/dev/null || true
          cp config/settings.json config/indicators.json config/bulletin_tables.json _site/data/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
