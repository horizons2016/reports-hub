name: رصد إصدارات المركز (collect)

on:
  schedule:
    - cron: "17 2,10 * * *"   # 06:17 and 14:17 Muscat time
  workflow_dispatch:
    inputs:
      no_issues:
        description: "لا تفتح تنبيهات (للاختبار)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: Install
        run: |
          pip install -r collector/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python collector/run.py ${{ inputs.no_issues && '--no-issues' || '' }}

      - name: Archive new file versions to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -d archive_out ] || { echo "nothing to archive"; exit 0; }
          for dir in archive_out/*/; do
            tag=$(basename "$dir")
            ls "$dir" | grep -q . || continue
            gh release view "$tag" >/dev/null 2>&1 || \
              gh release create "$tag" --title "أرشيف النسخ ${tag#archive-}" \
                --notes "نسخ ملفات إصدارات المركز كما رُصدت هذا الشهر. يُضاف كل ملف عند أول ظهوره أو تعديله." --latest=false
            gh release upload "$tag" "$dir"* --clobber
          done

      - name: Commit data
        run: |
          git config user.name "reports-hub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "no data changes"; else
            git commit -m "بيانات: تحديث $(TZ=Asia/Muscat date '+%Y-%m-%d %H:%M')"
            git pull --rebase --autostash
            git push
          fi

  deploy:
    needs: collect
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
